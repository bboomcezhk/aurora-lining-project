<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e17"><title>THE HAND ORACLE — Private Edition</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap');
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#32283f 0%,#17121f 40%,#0e0c13 100%);color:#f5eee7;font-family:'Noto Sans Thai',sans-serif;min-height:100vh}main{max-width:1000px;margin:auto;padding:56px 20px 90px;text-align:center}.eyebrow{letter-spacing:.35em;font-size:11px;color:#cbbcae}h1{font:500 clamp(48px,8vw,88px)/.95 'Cormorant Garamond',serif;letter-spacing:.04em;margin:24px 0 12px}.subtitle{font:italic 25px 'Cormorant Garamond',serif;color:#e3c6b0}p{line-height:1.85;color:#c7bac9}.form{max-width:620px;margin:38px auto 24px}textarea{width:100%;height:110px;background:#211b2a;color:#fff;border:1px solid #67536d;border-radius:14px;padding:18px;font:15px 'Noto Sans Thai',sans-serif;resize:vertical}button{background:#dbc4ad;color:#1c1420;border:0;border-radius:100px;padding:14px 30px;font:500 14px 'Noto Sans Thai',sans-serif;cursor:pointer}button:hover{background:#f1ddc6}button:focus-visible,textarea:focus-visible{outline:2px solid #f2d1b5;outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,24px);margin:45px auto;max-width:800px}.slot{min-width:0}.position{font-size:12px;letter-spacing:.03em;color:#c6b4c8;margin-bottom:14px}.card{aspect-ratio:3/5;position:relative;border:1px solid #ae91a0;border-radius:10px;background:radial-gradient(circle at 55% 40%,#675067,#261c31 57%,#130f1c);box-shadow:0 20px 45px #0006;overflow:hidden;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}.card:before{content:'✧';font-size:clamp(55px,12vw,135px);color:#ddc3b9;opacity:.45}.card:after{content:'THE HAND ORACLE';font:13px 'Cormorant Garamond',serif;letter-spacing:.12em;position:absolute;bottom:18px}.card.revealed{background:linear-gradient(155deg,#5c485b,#2b2537 50%,#6a4b4c)}.card.revealed:before{content:'✋';font-size:clamp(50px,10vw,105px);opacity:.72}.card .num{position:absolute;right:13px;top:12px;font:18px 'Cormorant Garamond',serif}.card .name{position:absolute;right:12px;bottom:14px;text-align:right;font:clamp(16px,2.6vw,28px) 'Cormorant Garamond',serif}.card.revealed:after{display:none}.readings{display:grid;gap:14px;text-align:left;margin:24px auto;max-width:800px}.reading{padding:20px 22px;border:1px solid #574659;background:#1e1925a8;border-radius:15px}.reading h3{font:30px 'Cormorant Garamond',serif;margin:0 0 5px}.reading p{margin:6px 0}.summary{padding:25px;border-top:1px solid #7c687a;max-width:800px;margin:auto;text-align:left}small{color:#aa9eab}footer{margin-top:65px;font-size:12px;color:#9f90a5}@media(max-width:560px){main{padding-top:38px}.cards{gap:8px}.card{padding:5px;border-radius:6px}.card .num{font-size:13px;right:7px;top:6px}.card .name{font-size:14px;right:6px;bottom:8px}.position{font-size:10px;min-height:34px}.reading{padding:17px}}
</style></head><body><main><div class="eyebrow">PRIVATE EDITION · 44 CARDS</div><h1>THE HAND<br>ORACLE</h1><div class="subtitle">Every Hand Holds a Story</div><p>ตั้งคำถามหนึ่งข้อ แล้วเปิดไพ่สามใบเพื่อสำรวจสิ่งที่เกิดขึ้น<br>สิ่งที่ควรพิจารณา และก้าวต่อไปของคุณ</p><div class="form"><textarea id="question" maxlength="500" placeholder="วันนี้คุณอยากถามอะไรกับไพ่?"></textarea><p><button id="draw">เปิดไพ่ 3 ใบ</button></p></div><section class="cards" id="cards" aria-live="polite"></section><div id="output" aria-live="polite"></div><footer>THE HAND ORACLE · Personal reflection, not a prediction of certainty.<br><small>ภาพไพ่ในรุ่นทดลองเป็นสัญลักษณ์ชั่วคราว รอภาพจริง 44 ใบ</small></footer></main><script>
const deck=[{"name":"The Opportunity","thai":"โอกาสใหม่","advice":"มองหาประตูที่เพิ่งเปิดและลองก้าวอย่างมีข้อมูล","roman":"I","group":"possibility"},{"name":"The Beginning","thai":"การเริ่มต้น","advice":"เริ่มจากก้าวเล็กที่ทำได้วันนี้","roman":"II","group":"possibility"},{"name":"The Success","thai":"ความสำเร็จ","advice":"กำหนดความสำเร็จด้วยมาตรฐานของตัวเอง","roman":"III","group":"possibility"},{"name":"The Abundance","thai":"ความอุดมสมบูรณ์","advice":"จัดสรรสิ่งที่มีอย่างรู้คุณค่า","roman":"IV","group":"possibility"},{"name":"The Growth","thai":"การเติบโต","advice":"ให้เวลากับสิ่งที่กำลังงอกงาม","roman":"V","group":"possibility"},{"name":"The Recognition","thai":"การได้รับการยอมรับ","advice":"รับคำชมและมองเห็นคุณค่าของตัวเอง","roman":"VI","group":"possibility"},{"name":"The Gift","thai":"ของขวัญ","advice":"เปิดใจรับความช่วยเหลือหรือโอกาสที่มาอย่างไม่คาดคิด","roman":"VII","group":"possibility"},{"name":"The Luck","thai":"โชคลาภและจังหวะที่ดี","advice":"เตรียมตัวให้พร้อมเมื่อจังหวะดีมาถึง","roman":"VIII","group":"possibility"},{"name":"The Attraction","thai":"แรงดึงดูด","advice":"แยกความชอบชั่วคราวออกจากความเข้ากันได้จริง","roman":"IX","group":"possibility"},{"name":"The Connection","thai":"ความผูกพัน","advice":"สร้างความสัมพันธ์ด้วยการรับฟังทั้งสองฝ่าย","roman":"X","group":"possibility"},{"name":"The Commitment","thai":"คำมั่นสัญญา","advice":"ทบทวนคำสัญญาและความรับผิดชอบก่อนตอบตกลง","roman":"XI","group":"possibility"},{"name":"The Trust","thai":"ความไว้วางใจ","advice":"สร้างความเชื่อใจด้วยการกระทำที่สม่ำเสมอ","roman":"XII","group":"possibility"},{"name":"The Support","thai":"ความช่วยเหลือ","advice":"ขอความช่วยเหลือเมื่อจำเป็นและแบ่งเบาผู้อื่นเมื่อทำได้","roman":"XIII","group":"possibility"},{"name":"The Healing","thai":"การเยียวยา","advice":"ให้พื้นที่กับการฟื้นตัวโดยไม่เร่งรัด","roman":"XIV","group":"possibility"},{"name":"The Protection","thai":"การปกป้อง","advice":"รักษาสิ่งสำคัญพร้อมไม่ปิดกั้นตัวเองเกินไป","roman":"XV","group":"possibility"},{"name":"The Celebration","thai":"การเฉลิมฉลอง","advice":"แบ่งปันความสำเร็จกับคนที่ร่วมทาง","roman":"XVI","group":"possibility"},{"name":"The Change","thai":"การเปลี่ยนแปลง","advice":"สังเกตว่าอะไรควรเปลี่ยนและอะไรควรเก็บไว้","roman":"XVII","group":"transition"},{"name":"The Journey","thai":"การเดินทาง","advice":"วางแผนการเดินทางหรือการเปลี่ยนผ่านให้รอบคอบ","roman":"XVIII","group":"transition"},{"name":"The Choice","thai":"ทางเลือก","advice":"เปรียบเทียบทางเลือกตามคุณค่าที่สำคัญกับคุณ","roman":"XIX","group":"transition"},{"name":"The Balance","thai":"ความสมดุล","advice":"หาจุดพอดีระหว่างความต้องการที่แข่งขันกัน","roman":"XX","group":"transition"},{"name":"The Patience","thai":"ความอดทน","advice":"รออย่างมีเป้าหมายและลงมือในส่วนที่ควบคุมได้","roman":"XXI","group":"transition"},{"name":"The Truth","thai":"ความจริง","advice":"ตรวจสอบข้อเท็จจริงก่อนสรุป","roman":"XXII","group":"transition"},{"name":"The Intuition","thai":"สัญชาตญาณ","advice":"ฟังความรู้สึกภายในแล้วตรวจทานกับหลักฐาน","roman":"XXIII","group":"transition"},{"name":"The Communication","thai":"การสื่อสาร","advice":"พูดสิ่งที่ต้องการให้ชัดและฟังคำตอบจริง ๆ","roman":"XXIV","group":"transition"},{"name":"The Boundaries","thai":"การกำหนดขอบเขต","advice":"บอกขอบเขตอย่างสุภาพและรักษาให้สม่ำเสมอ","roman":"XXV","group":"transition"},{"name":"The Release","thai":"การปล่อยวาง","advice":"ปล่อยสิ่งที่หมดหน้าที่โดยไม่ปฏิเสธบทเรียน","roman":"XXVI","group":"transition"},{"name":"The Rest","thai":"การพักผ่อน","advice":"พักให้เพียงพอก่อนตัดสินใจเรื่องใหญ่","roman":"XXVII","group":"transition"},{"name":"The Focus","thai":"การจดจ่อ","advice":"เลือกสิ่งสำคัญที่สุดหนึ่งเรื่องแล้วลงมือ","roman":"XXVIII","group":"transition"},{"name":"The Perspective","thai":"การเปลี่ยนมุมมอง","advice":"ลองมองสถานการณ์ผ่านสายตาอีกฝ่าย","roman":"XXIX","group":"transition"},{"name":"The Adaptation","thai":"การปรับตัว","advice":"เปลี่ยนวิธีการโดยไม่ทิ้งเป้าหมาย","roman":"XXX","group":"transition"},{"name":"The Expansion","thai":"การขยายโอกาส","advice":"เปิดพื้นที่ให้ความเป็นไปได้ใหม่อย่างมีแผน","roman":"XXXI","group":"transition"},{"name":"The Alignment","thai":"ความสอดคล้องลงตัว","advice":"ตรวจว่าความคิด คำพูด และการกระทำไปทางเดียวกัน","roman":"XXXII","group":"transition"},{"name":"The Fulfillment","thai":"ความสมหวัง","advice":"เห็นคุณค่าของสิ่งที่สำเร็จแล้วและสิ่งที่ยังอยากทำ","roman":"XXXIII","group":"transition"},{"name":"The Harmony","thai":"ความกลมกลืน","advice":"หาวิธีประสานความแตกต่างโดยไม่ลบตัวตน","roman":"XXXIV","group":"transition"},{"name":"The Delay","thai":"ความล่าช้า","advice":"ใช้เวลารอเพื่อเตรียมตัวแทนการฝืนจังหวะ","roman":"XXXV","group":"challenge"},{"name":"The Obstacle","thai":"อุปสรรค","advice":"แยกปัญหาใหญ่ออกเป็นขั้นตอนเล็ก ๆ","roman":"XXXVI","group":"challenge"},{"name":"The Conflict","thai":"ความขัดแย้ง","advice":"ลดอารมณ์ร้อนและหาประเด็นที่เห็นต่างจริง ๆ","roman":"XXXVII","group":"challenge"},{"name":"The Uncertainty","thai":"ความไม่แน่นอน","advice":"อย่าเติมช่องว่างด้วยการคาดเดา ตรวจสอบข้อมูลเพิ่ม","roman":"XXXVIII","group":"challenge"},{"name":"The Mask","thai":"สิ่งที่ปกปิด","advice":"มองให้ลึกกว่าภาพที่แสดงออกโดยไม่รีบกล่าวหา","roman":"XXXIX","group":"challenge"},{"name":"The Closed Door","thai":"ประตูที่ปิดอยู่","advice":"ยอมรับข้อจำกัดและสำรวจทางเลือกอื่น","roman":"XL","group":"challenge"},{"name":"The Chains","thai":"ความผูกมัด","advice":"สำรวจพันธะที่เลือกเองกับสิ่งที่ยังเปลี่ยนได้","roman":"XLI","group":"challenge"},{"name":"The Lesson","thai":"บทเรียน","advice":"นำข้อผิดพลาดมาออกแบบวิธีใหม่","roman":"XLII","group":"challenge"},{"name":"The Transformation","thai":"การเปลี่ยนแปลงครั้งใหญ่","advice":"ยอมรับการเปลี่ยนรูปแบบและรักษาสิ่งสำคัญ","roman":"XLIII","group":"challenge"},{"name":"The Surrender","thai":"การยอมรับสิ่งที่ควบคุมไม่ได้","advice":"แยกสิ่งที่ควบคุมได้ออกจากสิ่งที่ต้องยอมรับ","roman":"XLIV","group":"challenge"}];
const slots=['สถานการณ์ปัจจุบัน','สิ่งที่ควรพิจารณา','แนวทางก้าวต่อไป'];
const contextRules=[{type:'ความรักและความสัมพันธ์',re:/รัก|แฟน|คนคุย|คู่|สัมพันธ์|แต่งงาน|เลิก|เขาชอบ|เธอชอบ/i},{type:'งานและการเรียน',re:/งาน|อาชีพ|หัวหน้า|บริษัท|เรียน|สอบ|ธุรกิจ|ลูกค้า|สัมภาษณ์/i},{type:'การเงิน',re:/เงิน|รายได้|หนี้|ลงทุน|กำไร|ค่าใช้จ่าย|ซื้อ|ขาย/i}];
const nuances={possibility:'โอกาสกำลังมีพื้นที่ให้เติบโต แต่ยังต้องอาศัยการตัดสินใจและการลงมือ',transition:'สถานการณ์กำลังเคลื่อนตัว ลองปรับวิธีมองหรือวิธีลงมือให้สอดคล้องกับความจริง',challenge:'มีข้อจำกัดหรือประเด็นที่ควรระวัง การรับรู้ให้ชัดจะช่วยให้เลือกทางที่เหมาะกว่า'};
const cardsEl=document.getElementById('cards'),output=document.getElementById('output');
function reset(){cardsEl.innerHTML=slots.map((s)=>'<div class="slot"><div class="position">'+s+'</div><div class="card" aria-label="ไพ่คว่ำ"></div></div>').join('');output.innerHTML=''}
reset();
document.getElementById('draw').addEventListener('click',()=>{
const q=document.getElementById('question').value.trim();if(!q){alert('กรุณาพิมพ์คำถามก่อนเปิดไพ่');return}
const pool=[...deck.keys()];const chosen=[];for(let i=0;i<3;i++){const a=new Uint32Array(1);crypto.getRandomValues(a);const k=a[0]%pool.length;chosen.push(deck[pool.splice(k,1)[0]])}
const type=contextRules.find(x=>x.re.test(q))?.type||'ภาพรวมชีวิตและการตัดสินใจ';
cardsEl.innerHTML=chosen.map((c,i)=>'<div class="slot"><div class="position">'+slots[i]+'</div><div class="card revealed"><span class="num">'+c.roman+'</span><span class="name">'+c.name+'</span></div></div>').join('');
const starters=['ในจุดที่คุณยืนอยู่ ไพ่ใบนี้สะท้อนประเด็นเรื่อง','เบื้องหลังสถานการณ์ ไพ่ชวนให้คุณใส่ใจเรื่อง','สำหรับก้าวถัดไป ไพ่แนะนำให้พิจารณาเรื่อง'];
output.innerHTML='<div class="readings">'+chosen.map((c,i)=>'<article class="reading"><small>'+slots[i]+' · '+c.roman+'</small><h3>'+c.name+'</h3><p><strong>'+c.thai+'</strong> — '+starters[i]+' '+c.thai+' โดย'+nuances[c.group]+'</p><p><strong>คำแนะนำ:</strong> '+c.advice+'</p></article>').join('')+'</div><section class="summary"><div class="eyebrow">YOUR READING · '+type+'</div><h2>ภาพรวมคำอ่าน</h2><p>คำถามของคุณเกี่ยวข้องกับ'+type+' ไพ่เริ่มต้นที่ “'+chosen[0].thai+'” ก่อนชี้ให้เห็น “'+chosen[1].thai+'” เป็นประเด็นที่ต้องพิจารณา และจบที่ “'+chosen[2].thai+'” ซึ่งเป็นแนวทางในการเดินต่อ</p><p><strong>สิ่งที่ทำได้วันนี้:</strong> '+chosen[2].advice+'</p><small>คำอ่านนี้สร้างจากกฎและฐานข้อมูลไพ่ ไม่ใช่ AI และไม่ใช่คำยืนยันอนาคต</small></section>';
try{localStorage.setItem('handOracleLastReading',JSON.stringify({question:q,type,cards:chosen.map(c=>c.roman),time:new Date().toISOString()}))}catch(e){}
});
</script></body></html>
